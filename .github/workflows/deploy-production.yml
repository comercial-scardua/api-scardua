name: Deploy Produção

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "deploy" para confirmar'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  guard:
    runs-on: ubuntu-latest
    if: >-
      github.ref_type == 'tag' ||
      github.event.inputs.confirm == 'deploy'
    steps:
      - run: echo "Deploy autorizado"

  build-and-push:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "Deploy para produção"
          echo "Imagem: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          # Adicione aqui o comando de deploy para seu ambiente
          # Exemplos:
          # - SSH para o servidor e docker pull + restart
          # - kubectl set image deployment/api ...
          # - railway up / fly deploy / render deploy hook
