name: Deploy Produção

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "deploy" para confirmar'
        required: true

jobs:
  guard:
    runs-on: ubuntu-latest
    if: >-
      github.ref_type == 'tag' ||
      github.event.inputs.confirm == 'deploy'
    steps:
      - run: echo "Deploy autorizado"

  build:
    needs: guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx biome check --no-errors-on-unmatched
      - run: npm run build
      - run: npm test -- --passWithNoTests

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run build

      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          echo "Deploy para produção"
          # Configure aqui o método de deploy do seu ambiente:
          # - rsync via SSH
          # - Railway / Render / Fly.io CLI
          # - Upload para VPS
